name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: skills/pimp/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix skills/pimp --ignore-scripts --no-audit --no-fund
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_build_deck.js
