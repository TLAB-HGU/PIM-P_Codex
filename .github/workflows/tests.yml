name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned validation tools from dev
        uses: actions/checkout@v4
        with:
          ref: bd36a3bbaa28792a8c4d742ad3564c180ba3296c
          path: .validation-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /requirements-dev.txt
      - name: Stage validation tools without replacing the main skill
        run: |
          cp -R .validation-tools/scripts .validation-tools/tests .
          cp .validation-tools/requirements-dev.txt .
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: skills/pimp/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix skills/pimp --ignore-scripts --no-audit --no-fund
      - run: npm audit --prefix skills/pimp --omit=dev --audit-level=high
      - run: python scripts/validate_skill.py --distribution
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_build_deck.js
      - name: Install a standalone skill and prepare its runtime
        run: |
          python skills/pimp/scripts/install_skill.py --target-dir "$RUNNER_TEMP/pimp-install/skills" --setup
          python "$RUNNER_TEMP/pimp-install/skills/pimp/scripts/setup_runtime.py" --check
